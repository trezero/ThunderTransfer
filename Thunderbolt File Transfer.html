<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
		<script src="https://unpkg.com/unlazy@0.11.3/dist/unlazy.with-hashing.iife.js" defer init></script>
		<script type="text/javascript">
			window.tailwind.config = {
				darkMode: ['class'],
				theme: {
					extend: {
						colors: {
							border: 'hsl(var(--border))',
							input: 'hsl(var(--input))',
							ring: 'hsl(var(--ring))',
							background: 'hsl(var(--background))',
							foreground: 'hsl(var(--foreground))',
							primary: {
								DEFAULT: 'hsl(var(--primary))',
								foreground: 'hsl(var(--primary-foreground))'
							},
							secondary: {
								DEFAULT: 'hsl(var(--secondary))',
								foreground: 'hsl(var(--secondary-foreground))'
							},
							destructive: {
								DEFAULT: 'hsl(var(--destructive))',
								foreground: 'hsl(var(--destructive-foreground))'
							},
							muted: {
								DEFAULT: 'hsl(var(--muted))',
								foreground: 'hsl(var(--muted-foreground))'
							},
							accent: {
								DEFAULT: 'hsl(var(--accent))',
								foreground: 'hsl(var(--accent-foreground))'
							},
							popover: {
								DEFAULT: 'hsl(var(--popover))',
								foreground: 'hsl(var(--popover-foreground))'
							},
							card: {
								DEFAULT: 'hsl(var(--card))',
								foreground: 'hsl(var(--card-foreground))'
							},
						},
					}
				}
			}
		</script>
		<style type="text/tailwindcss">
			@layer base {
				:root {
					--background: 0 0% 100%;
--foreground: 240 10% 3.9%;
--card: 0 0% 100%;
--card-foreground: 240 10% 3.9%;
--popover: 0 0% 100%;
--popover-foreground: 240 10% 3.9%;
--primary: 240 5.9% 10%;
--primary-foreground: 0 0% 98%;
--secondary: 240 4.8% 95.9%;
--secondary-foreground: 240 5.9% 10%;
--muted: 240 4.8% 95.9%;
--muted-foreground: 240 3.8% 46.1%;
--accent: 240 4.8% 95.9%;
--accent-foreground: 240 5.9% 10%;
--destructive: 0 84.2% 60.2%;
--destructive-foreground: 0 0% 98%;
--border: 240 5.9% 90%;
--input: 240 5.9% 90%;
--ring: 240 5.9% 10%;
--radius: 0.5rem;
				}
				.dark {
					--background: 240 10% 3.9%;
--foreground: 0 0% 98%;
--card: 240 10% 3.9%;
--card-foreground: 0 0% 98%;
--popover: 240 10% 3.9%;
--popover-foreground: 0 0% 98%;
--primary: 0 0% 98%;
--primary-foreground: 240 5.9% 10%;
--secondary: 240 3.7% 15.9%;
--secondary-foreground: 0 0% 98%;
--muted: 240 3.7% 15.9%;
--muted-foreground: 240 5% 64.9%;
--accent: 240 3.7% 15.9%;
--accent-foreground: 0 0% 98%;
--destructive: 0 62.8% 30.6%;
--destructive-foreground: 0 0% 98%;
--border: 240 3.7% 15.9%;
--input: 240 3.7% 15.9%;
--ring: 240 4.9% 83.9%;
				}
			}
		</style>
  </head>
  <body>
    <div class="bg-white dark:bg-zinc-800 p-6 rounded-lg shadow-md">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold text-zinc-800 dark:text-white">ThunderTransfer</h1>
    <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md">
      <svg class="w-5 h-5 inline-block mr-2" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 4V20M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      Refresh
    </button>
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-zinc-800 dark:text-white font-medium mb-2" for="local-ip">Local TB IP:</label>
      <div class="flex items-center">
        <input class="bg-zinc-100 dark:bg-zinc-700 border-zinc-300 dark:border-zinc-600 rounded-md py-2 px-3 w-full" type="text" id="local-ip" value="Not detected" disabled>
        <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md ml-2">
          Update IP
        </button>
      </div>
    </div>
    <div>
      <label class="block text-zinc-800 dark:text-white font-medium mb-2" for="target-ip">Target IP:</label>
      <div class="flex items-center">
        <select class="bg-zinc-100 dark:bg-zinc-700 border-zinc-300 dark:border-zinc-600 rounded-md py-2 px-3 w-full" id="target-ip">
          <option value="169.254">169.254</option>
        </select>
        <input class="bg-zinc-100 dark:bg-zinc-700 border-zinc-300 dark:border-zinc-600 rounded-md py-2 px-3 w-20 ml-2" type="text" value="5001" disabled>
        <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md ml-2">
          Test Connection
        </button>
      </div>
    </div>
  </div>
  <div class="mt-6">
    <label class="block text-zinc-800 dark:text-white font-medium mb-2" for="destination">Destination:</label>
    <div class="flex items-center">
      <select class="bg-zinc-100 dark:bg-zinc-700 border-zinc-300 dark:border-zinc-600 rounded-md py-2 px-3 w-full" id="destination">
        <option>No file/folder selected</option>
      </select>
      <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md ml-2">
        New
      </button>
    </div>
  </div>
  <div class="mt-6 text-center">
    <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-md mr-2">
      Select File/Folder
    </button>
    <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-md mr-2">
      Transfer
    </button>
    <button class="bg-zinc-300 hover:bg-zinc-400 text-zinc-800 dark:text-white px-6 py-3 rounded-md">
      Stop Transfer
    </button>
  </div>
  <div class="mt-6 text-center text-zinc-800 dark:text-white">
    Status: Ready
  </div>
</div>
  </body>
</html>
